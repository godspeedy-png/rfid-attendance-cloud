<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Portal</title>
<style>
  :root {
    --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
    --blue: #2563eb; --blue-text: #ffffff;
    --green-bg: #dcfce7; --green: #166534; --red-bg: #fee2e2; --red: #991b1b;
    --amber-bg: #fef3c7; --amber: #92400e; --input: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120; --card: #111827; --text: #e2e8f0; --muted: #9ca3af; --border: #1f2937;
      --blue: #3b82f6; --blue-text: #ffffff;
      --green-bg: #064e3b; --green: #6ee7b7; --red-bg: #7f1d1d; --red: #fca5a5;
      --amber-bg: #78350f; --amber: #fcd34d; --input: #1f2937;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 1.2rem; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 1.4rem; margin-bottom: 1rem; }
  h1 { font-size: 1.4rem; margin-bottom: 0.3rem; }
  h2 { font-size: 1.05rem; margin-bottom: 0.8rem; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 0.9rem 0 0.3rem; }
  input { width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: 12px; background: var(--input); color: var(--text); font-size: 1rem; }
  input:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
  button { cursor: pointer; border: none; border-radius: 999px; padding: 0.75rem 1.3rem; font-size: 0.95rem; font-weight: 600; background: var(--blue); color: var(--blue-text); }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .full { width: 100%; margin-top: 1.2rem; }
  .error { color: var(--red); font-size: 0.9rem; min-height: 1.2rem; margin-top: 0.7rem; }
  .profile { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .grow { flex: 1; min-width: 160px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; }
  .stat { background: var(--bg); border-radius: 14px; padding: 0.8rem; text-align: center; }
  .stat b { display: block; font-size: 1.5rem; }
  .stat span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th { text-align: left; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
  td { padding: 0.65rem 0.6rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; padding: 0.2rem 0.7rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .pill.present { background: var(--green-bg); color: var(--green); }
  .pill.absent { background: var(--red-bg); color: var(--red); }
  .pill.late { background: var(--amber-bg); color: var(--amber); }
  .empty { text-align: center; color: var(--muted); padding: 1.5rem 0; }
  .hidden { display: none; }
  @media (max-width: 480px) { .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">

  <div class="card" id="loginCard">
    <h1>Student Portal</h1>
    <p class="muted">Log in to see your own attendance.</p>
    <label for="sid">Student ID</label>
    <input id="sid" type="text" autocomplete="username" autocapitalize="characters">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="error" id="loginError"></div>
    <button class="full" id="loginBtn">Log in</button>
    <p class="muted" style="margin-top: 1rem;">Forgot your password? Ask your administrator to set a new one.</p>
  </div>

  <div id="portal" class="hidden">
    <div class="card">
      <div class="profile">
        <div class="avatar" id="avatar">&#128100;</div>
        <div class="grow">
          <h1 id="pName"></h1>
          <p class="muted" id="pMeta"></p>
        </div>
        <button class="ghost" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="card">
      <h2>My attendance</h2>
      <div class="stats">
        <div class="stat"><b id="sRate">0%</b><span>Attendance</span></div>
        <div class="stat"><b id="sPresent">0</b><span>Present</span></div>
        <div class="stat"><b id="sLate">0</b><span>Late</span></div>
        <div class="stat"><b id="sAbsent">0</b><span>Absent</span></div>
      </div>
      <p class="muted" style="margin-top: 0.8rem;" id="sNote"></p>
    </div>

    <div class="card">
      <h2>My records</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Time</th><th>Status</th></tr></thead>
          <tbody id="records"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
  var $ = function (id) { return document.getElementById(id); };

  // Build page content with textContent so nothing from the database can inject code
  function cell(text) {
    var td = document.createElement('td');
    td.textContent = text;
    return td;
  }

  function showLogin(message) {
    $('portal').classList.add('hidden');
    $('loginCard').classList.remove('hidden');
    $('loginError').textContent = message || '';
  }

  function render(data) {
    $('loginCard').classList.add('hidden');
    $('portal').classList.remove('hidden');

    $('pName').textContent = data.student.name;
    $('pMeta').textContent = data.student.studentId + ' \u00B7 ' + (data.student.course || 'N/A');

    var avatar = $('avatar');
    avatar.textContent = '';
    var photo = data.student.photo;
    if (typeof photo === 'string' && photo.indexOf('data:image/') === 0) {
      var img = document.createElement('img');
      img.alt = '';
      img.src = photo;
      avatar.appendChild(img);
    } else {
      avatar.textContent = '\uD83D\uDC64';
    }

    var s = data.stats;
    $('sRate').textContent = s.rate + '%';
    $('sPresent').textContent = s.present;
    $('sLate').textContent = s.late;
    $('sAbsent').textContent = s.absent;
    $('sNote').textContent = s.daysRecorded
      ? 'Based on ' + s.daysRecorded + ' recorded day(s).'
      : 'No attendance has been recorded for you yet.';

    var body = $('records');
    body.textContent = '';
    if (!data.records.length) {
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 3;
      td.className = 'empty';
      td.textContent = 'No records yet';
      tr.appendChild(td);
      body.appendChild(tr);
      return;
    }
    data.records.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.appendChild(cell(r.date));
      tr.appendChild(cell(r.time));
      var td = document.createElement('td');
      var pill = document.createElement('span');
      var status = String(r.status);
      pill.className = 'pill ' + (status === 'Present' ? 'present' : status === 'Late' ? 'late' : 'absent');
      pill.textContent = status;
      td.appendChild(pill);
      tr.appendChild(td);
      body.appendChild(tr);
    });
  }

  function loadMe() {
    return fetch('/api/student/me')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.loggedIn) render(data); else showLogin('');
      })
      .catch(function () { showLogin('Could not reach the server. Try again.'); });
  }

  function login() {
    $('loginError').textContent = '';
    fetch('/api/student/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ studentId: $('sid').value, password: $('pw').value })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        if (!res.ok) { $('loginError').textContent = res.data.error || 'Login failed'; return; }
        $('pw').value = '';
        loadMe();
      })
      .catch(function () { $('loginError').textContent = 'Could not reach the server. Try again.'; });
  }

  $('loginBtn').addEventListener('click', login);
  $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  $('logoutBtn').addEventListener('click', function () {
    fetch('/api/student/logout', { method: 'POST' }).then(function () { showLogin(''); });
  });

  loadMe();
</script>
</body>
</html>
